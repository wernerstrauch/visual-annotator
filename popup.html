<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1c1c1e;
      color: #f4f4f5;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px 10px;
      font-weight: 600;
      font-size: 14px;
      border-bottom: 1px solid #38383a;
    }
    .header svg { color: #6366f1; }

    .toggle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px 16px;
      padding: 9px;
      border-radius: 8px;
      border: none;
      width: calc(100% - 32px);
      background: #6366f1;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s;
    }
    .toggle-btn:hover { background: #4f46e5; }
    .toggle-btn.off { background: #2c2c2e; color: #a1a1aa; }
    .toggle-btn.off:hover { background: #38383a; }
    .toggle-btn:disabled { opacity: .4; cursor: not-allowed; }

    .settings {
      padding: 2px 0 8px;
      border-top: 1px solid #38383a;
    }

    .setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
    }

    .setting-info { display: flex; flex-direction: column; gap: 1px; }
    .setting-label { font-size: 13px; font-weight: 500; }
    .setting-desc { font-size: 11px; color: #71717a; }

    .switch {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #38383a;
      border-radius: 10px;
      cursor: pointer;
      transition: background .2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform .2s;
    }
    .switch input:checked + .slider { background: #6366f1; }
    .switch input:checked + .slider::before { transform: translateX(16px); }

    .restricted {
      display: none;
      padding: 12px 16px;
      font-size: 12px;
      color: #71717a;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
    Visual Annotator
  </div>

  <button class="toggle-btn off" id="toggle-toolbar">Show Toolbar</button>
  <div class="restricted" id="restricted">Not available on this page</div>

  <div class="settings">
    <div class="setting">
      <div class="setting-info">
        <span class="setting-label">Always On</span>
        <span class="setting-desc">Auto-show on every page</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="always-on">
        <span class="slider"></span>
      </label>
    </div>
    <div class="setting">
      <div class="setting-info">
        <span class="setting-label">Auto Copy</span>
        <span class="setting-desc">Copy markdown after each add</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="auto-copy">
        <span class="slider"></span>
      </label>
    </div>
    <div class="setting">
      <div class="setting-info">
        <span class="setting-label">Auto Screenshot</span>
        <span class="setting-desc">Capture screenshot with each annotation</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="auto-screenshot">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
